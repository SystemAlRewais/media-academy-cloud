.app{min-height:100vh}.topbar{height:76px;background:var(--navy);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5;box-shadow:0 4px 20px #0b1b2c20}.topbar .brand-name{color:white}.topbar .brand-sub{color:#b7c9d9}.user-chip{display:flex;align-items:center;gap:12px;font-size:13px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#214e68;color:#a9f3e9;font-weight:900}.layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 76px)}.sidebar{background:#fff;border-left:1px solid var(--line);padding:22px 14px}.nav-title{font-size:10px;color:#9aa8b8;font-weight:800;padding:10px 12px}.nav{width:100%;display:flex;align-items:center;gap:11px;border:0;background:transparent;text-align:right;padding:12px;border-radius:10px;color:#52657b;margin:2px 0;font-size:13px}.nav.active,.nav:hover{background:#e9f9f8;color:#087f80;font-weight:800}.nav .ico{width:22px;text-align:center;font-size:16px}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:24px}.page-head h1{margin:0;color:var(--navy);font-size:24px}.page-head p{margin:7px 0 0;color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:22px}.stat,.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:19px;box-shadow:0 4px 18px #10233f07}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;color:var(--navy);margin-top:12px}.stat .stat-ico{float:left;color:#0aa9a7;background:#e8f9f8;border-radius:10px;padding:9px}.panel h3{margin:0 0 15px;color:var(--navy)}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:right;font-size:12px;white-space:normal}th{background:#f7fafc;color:#5e7188;font-size:11px}td{color:#34465a}.actions{display:flex;gap:7px}.actions button{padding:7px 10px;font-size:11px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.toolbar input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;min-width:220px}.empty{padding:35px;text-align:center;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 15px}.form-grid .wide{grid-column:1/-1}.modal-back{position:fixed;inset:0;background:#07182bcc;z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:23px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;color:var(--navy);font-size:19px}.modal-foot{display:flex;gap:9px;justify-content:flex-start;margin-top:15px}.pill{display:inline-block;padding:5px 9px;border-radius:30px;background:#e7f8f5;color:#07877e;font-size:10px}.welcome{background:linear-gradient(120deg,#10233f,#1c5368);border-radius:18px;color:white;padding:24px;margin-bottom:18px}.welcome h2{margin:0 0 8px}.welcome p{color:#c9d9e6;margin:0;font-size:13px}.footnote{font-size:11px;color:#9aabba;margin-top:22px;text-align:center}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;padding:8px;gap:5px;border-left:0;border-bottom:1px solid var(--line)}.nav-title{display:none}.nav{white-space:nowrap;width:auto;min-width:max-content;padding:10px}.main{padding:18px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar{padding:0 16px}}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:13px}.stat strong{font-size:22px}.main{padding:14px}.page-head h1{font-size:20px}.login-card{padding:24px}.user-chip span{display:none}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}}

<body>
<div id="root"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwljnBFfQdcODWwygvG7GaOuGAEDLRZEbhzEN5BzsTvO_4kpH_m_hWST8Bcyfqg6_nY/exec';
const $=s=>document.querySelector(s);
const state={token:sessionStorage.getItem('mac_token')||'',user:null,entity:'dashboard',data:[],modal:false};
const labels={dashboard:'الرئيسية',Users:'الطلاب',Cohorts:'الفرق الدراسية',Subjects:'المواد الدراسية',Books:'المكتبة والكتب',Content:'المحاضرات والمحتوى',Lectures:'جدول المحاضرات',AttendanceSessions:'جلسات الحضور',Attendance:'سجل الحضور',Exams:'الامتحانات',Grades:'الدرجات والنتائج',Announcements:'الإعلانات',Settings:'إعدادات المنصة'};
const icons={dashboard:'⌂',Users:'♙',Cohorts:'▦',Subjects:'▤',Books:'▣',Content:'▧',Lectures:'◷',AttendanceSessions:'◎',Attendance:'✓',Exams:'✎',Grades:'▥',Announcements:'◉',Settings:'⚙'};
const fields={
Users:[['username','اسم الدخول'],['full_name','اسم الطالب'],['email','البريد الإلكتروني'],['phone','الهاتف'],['cohort_id','الفرقة','select:Cohorts'],['password','كلمة المرور','password']],
Cohorts:[['name','اسم الفرقة'],['level','المستوى'],['academic_year','العام الدراسي']],
Subjects:[['name','اسم المادة'],['subject_code','كود المادة'],['cohort_id','الفرقة','select:Cohorts'],['instructor','المحاضر'],['description','الوصف','textarea']],
Books:[['title','اسم الكتاب'],['author','المؤلف'],['cohort_id','الفرقة','select:Cohorts'],['subject_id','المادة','select:Subjects'],['description','الوصف','textarea'],['file_url','رابط ملف الكتاب PDF'],['cover_url','رابط الغلاف']],
Content:[['title','عنوان المحتوى'],['content_type','نوع المحتوى','select:content'],['cohort_id','الفرقة','select:Cohorts'],['subject_id','المادة','select:Subjects'],['description','الوصف','textarea'],['file_url','رابط الملف أو الفيديو']],
Lectures:[['title','عنوان المحاضرة'],['cohort_id','الفرقة','select:Cohorts'],['subject_id','المادة','select:Subjects'],['starts_at','تاريخ ووقت البداية','datetime-local'],['ends_at','تاريخ ووقت النهاية','datetime-local'],['location_name','المكان']],
AttendanceSessions:[['lecture_id','المحاضرة','select:Lectures'],['location_url','رابط موقع المحاضرة'],['latitude','خط العرض'],['longitude','خط الطول'],['radius_meters','النطاق بالمتر'],['opens_at','يفتح في','datetime-local'],['closes_at','يغلق في','datetime-local']],
Exams:[['title','اسم الامتحان'],['cohort_id','الفرقة','select:Cohorts'],['subject_id','المادة','select:Subjects'],['exam_date','موعد الامتحان','date'],['total_marks','الدرجة النهائية']],
Grades:[['student_id','الطالب','select:Users'],['subject_id','المادة','select:Subjects'],['exam_id','الامتحان','select:Exams'],['score','الدرجة'],['total_marks','من']],
Announcements:[['title','عنوان الإعلان'],['cohort_id','الفرقة (اتركها فارغة للكل)','select:Cohorts'],['body','نص الإعلان','textarea']],Settings:[['key','مفتاح الإعداد'],['value','قيمة الإعداد','textarea']]
};
const columns={
Users:['username','full_name','cohort_id','status'],Cohorts:['name','level','academic_year','status'],Subjects:['name','subject_code','instructor','cohort_id'],Books:['title','author','cohort_id','file_url'],Content:['title','content_type','cohort_id','file_url'],Lectures:['title','starts_at','location_name','status'],AttendanceSessions:['lecture_id','radius_meters','opens_at','status'],Attendance:['student_code','checked_at','distance_meters','status'],Exams:['title','exam_date','total_marks','status'],Grades:['student_id','score','total_marks','published_at'],Announcements:['title','body','status'],Settings:['key','value']
};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function encode(o){const bytes=new TextEncoder().encode(JSON.stringify(o));let b='';bytes.forEach(x=>b+=String.fromCharCode(x));return btoa(b).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');}
function api(action,data={}){return new Promise((resolve,reject)=>{if(!API_URL.startsWith('https://script.google.com/'))return reject(Error('لم يتم ربط رابط Google Apps Script بعد.'));const cb='__cb'+Math.random().toString(36).slice(2);const s=document.createElement('script');const t=setTimeout(()=>done(Error('انتهت مهلة الاتصال بالخادم')),18000);function done(err,res){clearTimeout(t);delete window[cb];s.remove();err?reject(err):res&&res.ok?resolve(res):reject(Error(res?.error||'تعذر تنفيذ الطلب'));}window[cb]=res=>done(null,res);s.onerror=()=>done(Error('تعذر الاتصال بالخادم. راجع رابط النشر وصلاحية Anyone.'));s.src=API_URL+'?q='+encodeURIComponent(encode({action,...data,token:state.token}))+'&callback='+cb;document.body.appendChild(s);});}
function toast(msg,ok=false){const el=$('#notice');if(!el)return;el.className=ok?'success':'error';el.textContent=msg;el.classList.remove('hidden');}
function loginScreen(){ $('#root').innerHTML='<div class="login-wrap"><form class="login-card" id="loginForm"><div class="brand"><div class="brand-mark">M</div><div><div class="brand-name">MEDIA ACADEMY CLOUD</div><div class="brand-sub">منظومة الإدارة الجامعية الذكية</div></div></div><h1>أهلاً بيك في منصتك</h1><p class="muted">سجّل دخولك للوصول إلى الخدمات التعليمية والإدارية.</p><div class="field"><label>اسم المستخدم</label><input id="username" autocomplete="username" required placeholder="أدخل اسم المستخدم"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required placeholder="كلمة المرور"></div><div id="notice" class="hidden"></div><button class="btn btn-block" type="submit">تسجيل الدخول</button><div class="footnote">MEDIA ACADEMY · LEARN · CONNECT · ACHIEVE</div></form></div>';
$('#loginForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const r=await api('login',{username:$('#username').value.trim(),password:$('#password').value});state.token=r.token;state.user=r.user;sessionStorage.setItem('mac_token',r.token);render();}catch(err){toast(err.message);}finally{b.disabled=false;}};}
function menu(){return state.user.role==='owner'||state.user.role==='admin'?Object.keys(labels):['dashboard','Subjects','Books','Content','Lectures','Exams','Grades','Announcements','Attendance'];}
function shell(){const isAdmin=['owner','admin'].includes(state.user.role);$('#root').innerHTML='<div class="app"><header class="topbar"><div class="brand"><div class="brand-mark">M</div><div><div class="brand-name">MEDIA ACADEMY CLOUD</div><div class="brand-sub">منظومة الإدارة الجامعية الذكية</div></div></div><div class="user-chip"><div class="avatar">'+esc((state.user.full_name||'م').slice(0,1))+'</div><span>'+esc(state.user.full_name)+' · '+(isAdmin?'الإدارة':'طالب')+'</span><button class="btn btn-light" id="logout">خروج</button></div></header><div class="layout"><aside class="sidebar"><div class="nav-title">القائمة الرئيسية</div>'+menu().map(k=>'<button class="nav '+(state.entity===k?'active':'')+'" data-page="'+k+'"><span class="ico">'+(icons[k]||'•')+'</span>'+labels[k]+'</button>').join('')+'</aside><main class="main" id="main"></main></div></div>';
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{state.entity=b.dataset.page;renderPage();document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n===b));});
$('#logout').onclick=async()=>{try{await api('logout');}catch(e){}state.token='';state.user=null;sessionStorage.removeItem('mac_token');loginScreen();};}
async function render(){if(!state.user){loginScreen();return;}shell();await renderPage();}
async function load(entity){const r=await api('list',{entity});return r.data||[];}
async function renderPage(){const main=$('#main');if(state.entity==='dashboard'){main.innerHTML='<div class="page-head"><div><h1>لوحة المعلومات</h1><p>نظرة عامة على منظومة Media Academy Cloud</p></div></div><div class="welcome"><h2>مرحباً، '+esc(state.user.full_name)+'</h2><p>كل خدمات الأكاديمية وبياناتها في مكان واحد.</p></div><div id="stats" class="stats"></div><div class="panel"><h3>آخر التحديثات</h3><p class="muted">البيانات المعروضة متصلة مباشرة بقاعدة Google Sheets.</p><div id="recent" class="muted">جارٍ تحميل البيانات...</div></div>';const entities=state.user.role==='student'?['Subjects','Books','Content','Lectures','Exams','Grades','Announcements']:['Users','Subjects','Books','Content','Lectures','Exams','Announcements'];const counts=await Promise.all(entities.map(async e=>[e,(await load(e)).length]));$('#stats').innerHTML=counts.map(([e,n])=>'<div class="stat"><span class="stat-ico">'+(icons[e]||'◈')+'</span><small>'+labels[e]+'</small><strong>'+n+'</strong></div>').join('');$('#recent').textContent='تم تحميل '+counts.reduce((a,x)=>a+x[1],0)+' سجل من قاعدة البيانات.';return;}
const entity=state.entity;main.innerHTML='<div class="page-head"><div><h1>'+labels[entity]+'</h1><p>إدارة ومتابعة بيانات '+labels[entity]+' من قاعدة التخزين السحابية.</p></div>'+(state.user.role==='owner'||state.user.role==='admin'?'<button class="btn" id="add">＋ إضافة جديد</button>':'')+'</div><div id="notice" class="hidden"></div><div class="toolbar"><input id="filter" placeholder="بحث في السجلات..."><span class="muted" id="count"></span></div><div id="table" class="table-wrap"><div class="empty">جارٍ تحميل البيانات...</div></div>';
try{state.data=await load(entity);drawTable();}catch(e){toast(e.message);}}
function drawTable(){const entity=state.entity,rows=state.data,cols=columns[entity]||Object.keys(rows[0]||{}).slice(0,5);$('#count').textContent=rows.length+' سجل';const renderRows=arr=>arr.map(row=>'<tr>'+cols.map(k=>'<td>'+esc(k==='cohort_id'?((state.cohorts||[]).find(x=>x.cohort_id===row[k])||{})?.name||row[k]:row[k])+'</td>').join('')+(state.user.role==='owner'||state.user.role==='admin'?'<td><div class="actions"><button class="btn btn-light" data-edit="'+esc(row[Object.keys(row).find(k=>k.endsWith('_id'))]||row.key)+'">تعديل</button>'+(entity!=='Users'?'<button class="btn btn-danger" data-del="'+esc(row[Object.keys(row).find(k=>k.endsWith('_id'))]||row.key)+'">حذف</button>':'')+'</div></td>':'')+'</tr>').join('');
$('#table').innerHTML=rows.length?'<table><thead><tr>'+cols.map(k=>'<th>'+esc(({username:'اسم الدخول',full_name:'الاسم',cohort_id:'الفرقة',subject_code:'الكود',instructor:'المحاضر',title:'العنوان',author:'المؤلف',file_url:'رابط الملف',starts_at:'البداية',ends_at:'النهاية',score:'الدرجة',total_marks:'من',exam_date:'الموعد',checked_at:'وقت الحضور',student_code:'كود الطالب',status:'الحالة',name:'الاسم',level:'المستوى',academic_year:'العام الدراسي',body:'التفاصيل'}[k]||k))+'</th>').join('')+((state.user.role==='owner'||state.user.role==='admin')?'<th>إجراءات</th>':'')+'</tr></thead><tbody>'+renderRows(rows)+'</tbody></table>':'<div class="empty">لا توجد بيانات حتى الآن.</div>';
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openForm(rows.find(x=>String(x[Object.keys(x).find(k=>k.endsWith('_id'))]||x.key)===b.dataset.edit)));
document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteRecord(b.dataset.del));
$('#filter').oninput=()=>{const q=$('#filter').value.toLowerCase();const filtered=rows.filter(r=>Object.values(r).join(' ').toLowerCase().includes(q));$('#table').querySelector('tbody').innerHTML=renderRows(filtered);};}
async function optionsFor(type){let e=type.split(':')[1];if(e==='content')return ['كتاب','ملف PDF','فيديو','رابط'];const rows=await load(e);if(e==='Users')return rows.filter(x=>x.role==='student').map(x=>({value:x.user_id,label:x.full_name+' ('+x.username+')'}));return rows.map(x=>({value:x[Object.keys(x).find(k=>k.endsWith('_id'))],label:x.name||x.title||x.full_name||x.subject_code}));}
async function openForm(record={}){const entity=state.entity,defs=fields[entity]||[];if(!defs.length){toast('نموذج هذا القسم قيد التجهيز.');return;}const idKey=Object.keys(record).find(k=>k.endsWith('_id'));let inputs='';for(const [key,label,type] of defs){let value=record[key]??'';let control='';if(type&&type.startsWith('select:')){let opts=await optionsFor(type);control='<select name="'+key+'"><option value="">— اختر —</option>'+opts.map(o=>{let v=typeof o==='string'?o:o.value,l=typeof o==='string'?o:o.label;return '<option value="'+esc(v)+'" '+(String(v)===String(value)?'selected':'')+'>'+esc(l)+'</option>';}).join('')+'</select>';}else if(type==='textarea')control='<textarea name="'+key+'" rows="3">'+esc(value)+'</textarea>';else control='<input name="'+key+'" type="'+(type||'text')+'" value="'+esc(value)+'" '+(key==='password'&&!record.user_id?'required':'')+'>';inputs+='<div class="field '+(type==='textarea'||key==='description'?'wide':'')+'"><label>'+label+'</label>'+control+'</div>';}
const back=document.createElement('div');back.className='modal-back';back.innerHTML='<form class="modal" id="recordForm"><div class="modal-head"><h2>'+(record[idKey]?'تعديل':'إضافة')+' — '+labels[entity]+'</h2><button type="button" class="btn btn-light" id="close">✕</button></div><div class="form-grid">'+inputs+'</div><div id="formNotice" class="hidden"></div><div class="modal-foot"><button class="btn" type="submit">حفظ البيانات</button><button class="btn btn-light" type="button" id="cancel">إلغاء</button></div></form>';document.body.appendChild(back);const close=()=>back.remove();$('#close').onclick=close;$('#cancel').onclick=close;$('#recordForm').onsubmit=async e=>{e.preventDefault();const btn=e.submitter;btn.disabled=true;const data=Object.fromEntries(new FormData(e.currentTarget).entries());if(record[idKey])data[idKey]=record[idKey];try{await api('save',{entity,record:data});close();state.data=await load(entity);drawTable();toast('تم حفظ البيانات بنجاح.',true);}catch(err){$('#formNotice').className='error';$('#formNotice').textContent=err.message;}finally{btn.disabled=false;}};}
async function deleteRecord(id){if(!confirm('هل تريد حذف هذا السجل؟'))return;try{await api('delete',{entity:state.entity,id});state.data=await load(state.entity);drawTable();toast('تم الحذف.',true);}catch(e){toast(e.message);}}
async function start(){if(!API_URL.startsWith('https://script.google.com/')){loginScreen();return;}try{await api('setup');if(state.token){const r=await api('me');state.user=r.user;await render();}else loginScreen();}catch(e){state.token='';sessionStorage.removeItem('mac_token');loginScreen();toast(e.message);}}
document.addEventListener('click',e=>{if(e.target&&e.target.id==='add')openForm();});start();
</script></body></html>
