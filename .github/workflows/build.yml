name: Verify Media Academy Cloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Apps Script syntax
        run: node --check < backend/Code.gs
      - name: Check inline browser JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert scripts, "No application script found"
          Path("/tmp/app.js").write_text("\n".join(scripts))
          PY
          node --check /tmp/app.js
