name: Verify Media Academy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript files
        run: |
          node --check assets/js/config.js
          node --check assets/js/app.js
          node --check < backend/Code.gs
      - name: Validate site assets
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'assets/css/style.css',
              'assets/js/config.js',
              'assets/js/app.js',
          ]
          missing = [item for item in required if item not in html or not Path(item).is_file()]
          if missing:
              raise SystemExit('Missing site assets: ' + ', '.join(missing))
          print('All referenced site assets exist.')
          PY
