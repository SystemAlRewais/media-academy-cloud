name: Verify Media Academy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check application JavaScript
        run: node --check app.js
      - name: Check required files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s sheets/Students.csv
