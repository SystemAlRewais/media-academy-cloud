name: Verify Media Academy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert scripts, 'No script block found'
          Path('/tmp/site.js').write_text('\\n'.join(scripts))
          PY
          node --check /tmp/site.js
